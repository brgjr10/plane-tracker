<div class="map">
  <!-- Leaflet map canvas. Always in the DOM so viewChild queries it in
       ngAfterViewInit; Leaflet initialises on it once mapReady is true. -->
  <div #mapContainer class="map__canvas"></div>

  <!-- Toggle: hide grounded (on_ground) aircraft. -->
  <button
    class="map__toggle map__toggle--hide-grounded"
    [attr.aria-pressed]="hideGrounded()"
    [class.map__toggle--active]="hideGrounded()"
    (click)="toggleHideGrounded()"
    title="Hide grounded aircraft"
  >
    <span class="map__toggle__label">{{ hideGrounded() ? 'Show grounded' : 'Hide grounded' }}</span>
  </button>

  @if (!feedConnected() && feedError(); as error) {
    <div class="map__banner" role="alert" aria-live="polite">
      <p class="map__banner__message">{{ error }}</p>
      <button
        class="map__banner__dismiss"
        (click)="dismissFeedError()"
        aria-label="Dismiss"
      >
        &times;
      </button>
    </div>
  }

  @if (!mapReady) {
    <div class="map__status" role="status" [class.map__status--error]="loadError">
      @if (loadError) {
        <p>Map failed to load.</p>
        <p class="map__status-detail">{{ loadError }}</p>
      } @else {
        <p>Loading map…</p>
      }
    </div>
  }

  <!-- Floating details panel for the selected aircraft -->
  @if (selectedFlightInfo(); as info) {
    <app-aircraft-info-panel
      class="map__panel"
      [info]="info"
      [activeActions]="activeActions()"
      (close)="clearSelection()"
      (action)="onPanelAction($event)"
    />
  }
</div>
